<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3454E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Baqueta">
<meta name="description" content="Aprenda bateria lendo partitura: do iniciante ao avançado.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Baqueta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-first app shell — sticky brand bar, one 640px column, fixed tab bar; lessons and the player open as full-screen sheets above it. */
:root{
  --bg:#ECEEF5; --surface:#FFFFFF; --surface-2:#F4F5FA; --line:#D8DBE8; --ink:#171A2C; --muted:#585E7E;
  --accent:#3454E6; --accent-deep:#2238AA; --accent-ink:#FFFFFF; --accent-soft:#E2E7FD;
  --good:#11905A; --good-deep:#0B6B42; --good-soft:#DBF3E6; --bad:#CC3838; --bad-soft:#FBE3E3; --warn:#B87B00;
  --paper:#FFFFFF; --staff:#1E2136; --staff-soft:#8E93AC; --head:#F2F0E9; --head-ink:#3B3E52; --hoop:#A9AEC2; --stand:#A2A7BC;
  --brz-1:#F1CF7E; --brz-2:#D19A35; --brz-3:#A86F1C; --brz-line:#8E5E17;
  --locked:#CDD1DF; --locked-deep:#B0B5C8; --on-uc:#FFFFFF;
  --c-K:#E0522C; --c-S:#7650D8; --c-H:#0C9A90; --c-P:#0A766F; --c-R:#2A7BD1; --c-C:#C98306; --c-Z:#CC3D7B; --c-T:#4A9A2B; --c-M:#2D854B; --c-F:#6B7C1B; --c-A:#8A6644;
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F111B; --surface:#191C2A; --surface-2:#212536; --line:#2E3347; --ink:#ECEEF7; --muted:#A2A8C3;
    --accent:#7A93FF; --accent-deep:#4A60CC; --accent-ink:#0C0F1D; --accent-soft:#242B4E;
    --good:#3CC983; --good-deep:#228A57; --good-soft:#15301F; --bad:#FF6B6B; --bad-soft:#3A1D22; --warn:#F0B53A;
    --paper:#151826; --staff:#DFE2F0; --staff-soft:#6C7290; --head:#D9D6CC; --head-ink:#2C2E3A; --hoop:#6D7390; --stand:#555B76;
    --brz-1:#E9C46E; --brz-2:#BF8A2C; --brz-3:#8C5C16; --brz-line:#6E4710;
    --locked:#353A50; --locked-deep:#24283A; --on-uc:#0F111B;
    --c-K:#FF7A52; --c-S:#A98CFF; --c-H:#33CFC3; --c-P:#25AFA5; --c-R:#69AFFF; --c-C:#F2B53F; --c-Z:#FF77B0; --c-T:#7DD35A; --c-M:#56BE7B; --c-F:#B2C64C; --c-A:#C9A07C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F111B; --surface:#191C2A; --surface-2:#212536; --line:#2E3347; --ink:#ECEEF7; --muted:#A2A8C3;
  --accent:#7A93FF; --accent-deep:#4A60CC; --accent-ink:#0C0F1D; --accent-soft:#242B4E;
  --good:#3CC983; --good-deep:#228A57; --good-soft:#15301F; --bad:#FF6B6B; --bad-soft:#3A1D22; --warn:#F0B53A;
  --paper:#151826; --staff:#DFE2F0; --staff-soft:#6C7290; --head:#D9D6CC; --head-ink:#2C2E3A; --hoop:#6D7390; --stand:#555B76;
  --brz-1:#E9C46E; --brz-2:#BF8A2C; --brz-3:#8C5C16; --brz-line:#6E4710;
  --locked:#353A50; --locked-deep:#24283A; --on-uc:#0F111B;
  --c-K:#FF7A52; --c-S:#A98CFF; --c-H:#33CFC3; --c-P:#25AFA5; --c-R:#69AFFF; --c-C:#F2B53F; --c-Z:#FF77B0; --c-T:#7DD35A; --c-M:#56BE7B; --c-F:#B2C64C; --c-A:#C9A07C;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.01em}
p{margin:0}
svg{display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar & tabs */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.topbar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand svg{width:30px;height:30px}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
.stat svg{width:20px;height:20px}
.stat.fire{color:var(--c-K)} .stat.xp{color:var(--c-C)}
.icon-btn{width:38px;height:38px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
main{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 96px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;letter-spacing:.02em}
.tab svg{width:25px;height:25px}
.tab[aria-current="page"]{color:var(--accent)}
.view[hidden]{display:none}
.view-h{display:grid;gap:4px;margin-bottom:18px}
.view-h h1{font-size:28px;font-weight:800}
.view-h p{color:var(--muted)}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* ---------- buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:15px;letter-spacing:.03em;cursor:pointer;transition:transform .06s,box-shadow .06s;text-decoration:none}
.btn svg{width:19px;height:19px}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-deep)}
.btn-primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.btn-primary:disabled{background:var(--locked);color:var(--muted);box-shadow:0 4px 0 var(--locked-deep);cursor:not-allowed;transform:none}
.btn-good{background:var(--good);color:#fff;box-shadow:0 4px 0 var(--good-deep)}
.btn-bad{background:var(--bad);color:#fff;box-shadow:0 4px 0 color-mix(in oklab,var(--bad),black 30%)}
.btn-ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);padding:11px 16px}
.btn-ghost:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn-wide{width:100%}

/* ---------- path */
.unit{margin-bottom:28px}
.unit-band{position:relative;border-radius:20px;padding:16px 16px 14px;background:color-mix(in oklab,var(--uc) 14%,var(--surface));border:1.5px solid color-mix(in oklab,var(--uc) 35%,transparent);display:grid;gap:6px}
.unit-band .eyebrow{color:var(--uc)}
.unit-band h2{font-size:22px;font-weight:800}
.unit-band p{color:var(--muted);font-size:14px;max-width:46ch}
.unit-prog{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:12.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.unit-prog .bar{flex:1;height:8px;border-radius:8px;background:color-mix(in oklab,var(--uc) 18%,var(--surface-2));overflow:hidden}
.unit-prog .bar i{display:block;height:100%;background:var(--uc);border-radius:8px}
.nodes{display:grid;gap:14px;padding:50px 0 4px}
.node-row{display:flex;flex-direction:column;align-items:center;transform:translateX(var(--off));position:relative}
.node{--uc2:color-mix(in oklab,var(--uc),black 28%);width:74px;height:70px;border-radius:50%;border:0;position:relative;cursor:pointer;background:var(--uc);color:var(--on-uc);box-shadow:0 7px 0 var(--uc2);display:grid;place-items:center;transition:transform .08s,box-shadow .08s}
.node::before{content:"";position:absolute;inset:7px;border-radius:50%;border:3px solid color-mix(in oklab,var(--on-uc) 32%,transparent)}
.node svg{width:30px;height:30px;position:relative}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--uc2)}
.node.locked{background:var(--locked);color:var(--muted);box-shadow:0 7px 0 var(--locked-deep)}
.node.locked::before{border-color:color-mix(in oklab,var(--muted) 25%,transparent)}
.node.current::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid color-mix(in oklab,var(--uc) 45%,transparent);animation:ring 1.6s ease-in-out infinite}
@keyframes ring{50%{transform:scale(1.07);opacity:.55}}
.node-t{margin-top:12px;font-size:13px;font-weight:700;text-align:center;max-width:150px;line-height:1.25}
.node-row.is-locked .node-t{color:var(--muted)}
.node-stars{display:flex;gap:2px;margin-top:3px}
.node-stars svg{width:14px;height:14px}
.st-on{fill:var(--c-C)} .st-off{fill:var(--locked)}
.bubble{position:absolute;top:-38px;background:var(--surface);color:var(--uc);border:2px solid var(--line);font-weight:800;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border-radius:11px;white-space:nowrap;animation:bob 1.4s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-4px)}}
.path-end{text-align:center;color:var(--muted);font-size:13.5px;padding:8px 0 24px}

/* ---------- paper & score */
.paper{background:var(--paper);border:1px solid var(--line);border-radius:16px;position:relative}
.pl-paper{padding:6px 6px 2px;overflow:hidden}
.pl-svg{width:100%}
.score{width:100%;height:auto;overflow:visible}
.score .sl{stroke:var(--staff-soft);stroke-width:1}
.score .bl{stroke:var(--staff);stroke-width:1.3}
.score .blk,.score .dt,.score .gl,.score .bm{fill:var(--staff)}
.score .stem{stroke:var(--staff);stroke-width:1.25}
.score .lg{stroke:var(--staff);stroke-width:1.3}
.score .op{fill:none;stroke:var(--staff);stroke-width:1.3}
.score .tb{fill:none;stroke:var(--staff);stroke-width:1}
.score .tup{font:italic 700 11.5px var(--f-num);fill:var(--staff);text-anchor:middle}
.score .bn{font:600 10px var(--f-body);fill:var(--staff-soft)}
.score .ct{font:600 10.5px var(--f-body);fill:var(--staff-soft);text-anchor:middle;transition:fill .08s}
.score .ct.cb{fill:var(--staff);font-weight:800;font-size:11px}
.score .ct.on{fill:var(--accent);font-weight:800}
.score .sec rect{fill:var(--accent-soft)}
.score .sec text{font:800 9.5px var(--f-body);fill:var(--accent);letter-spacing:.06em;text-transform:uppercase;text-anchor:middle}
.score .cur{fill:var(--accent);opacity:0;transition:opacity .15s}
.score .cur.vis{opacity:.55}
.score .nh{fill:var(--nc,var(--staff))}
.score .nh .hd.x{stroke:var(--nc,var(--staff));stroke-width:.55}
.score .nh .hd{transform-box:fill-box;transform-origin:center;transition:transform .07s}
.score .nh.on .hd{transform:scale(1.42)}
.score .par{fill:none;stroke:var(--nc,var(--staff));stroke-width:1.25}
.score .nh.i-K{--nc:var(--c-K)} .score .nh.i-S{--nc:var(--c-S)} .score .nh.i-H{--nc:var(--c-H)} .score .nh.i-P{--nc:var(--c-P)} .score .nh.i-R{--nc:var(--c-R)} .score .nh.i-C{--nc:var(--c-C)} .score .nh.i-Z{--nc:var(--c-Z)} .score .nh.i-T{--nc:var(--c-T)} .score .nh.i-M{--nc:var(--c-M)} .score .nh.i-F{--nc:var(--c-F)} .score .nh.i-A{--nc:var(--c-A)}
.score.ink .nh, html.no-colors .score .nh{--nc:var(--staff)}
.score .nh.r-p .hd,.score .nh.r-b .hd{fill:var(--good)}
.score .nh.r-q .hd{fill:var(--warn)}
.score .nh.r-m .hd{fill:var(--bad)}
.score .nl{font:800 11.5px var(--f-body);text-anchor:middle}
.score .np{font:600 10px var(--f-body);fill:var(--staff-soft);text-anchor:middle}
.nstaff{margin:0 auto}

/* ---------- player */
.pl{display:grid;gap:12px}
.pl-secs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.pl-secs::-webkit-scrollbar{display:none}
.sec-b{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.sec-b.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pl.song .pl-paper{max-height:min(58vh,560px);overflow-y:auto;overscroll-behavior:contain}
.pl-count{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;background:color-mix(in oklab,var(--paper) 78%,transparent);border-radius:16px;z-index:2;pointer-events:none}
.pl-count b{font-family:var(--f-display);font-size:64px;line-height:1;color:var(--accent)}
.pl-count span{font-weight:700;color:var(--muted);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.mini-play{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 var(--accent-deep);z-index:3}
.mini-play svg{width:20px;height:20px}
.pl-lights{display:flex;flex-wrap:wrap;gap:6px}
.lt{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px 5px 8px;font-size:12.5px;font-weight:700;cursor:pointer;transition:background .1s}
.lt i{width:11px;height:11px;border-radius:50%;background:var(--pc);box-shadow:0 0 0 3px color-mix(in oklab,var(--pc) 22%,transparent)}
.lt.hit{animation:lthit .16s ease-out}
@keyframes lthit{0%{background:color-mix(in oklab,var(--pc) 35%,var(--surface));border-color:var(--pc)}100%{background:var(--surface)}}
.lt[aria-pressed="false"]{opacity:.5;text-decoration:line-through}
.lt[aria-pressed="false"] i{background:transparent;box-shadow:inset 0 0 0 2px var(--pc)}
.pl-hint{font-size:12.5px;color:var(--muted);margin-top:-4px}
.pl-ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.btn-play{width:58px;height:58px;flex:none;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 var(--accent-deep)}
.btn-play:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.btn-play svg{width:26px;height:26px}
.btn-play.on{background:var(--c-K);box-shadow:0 4px 0 color-mix(in oklab,var(--c-K),black 30%)}
.tempo{display:flex;align-items:center;gap:6px;flex:1;min-width:190px}
.tb{width:34px;height:34px;flex:none;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:18px;font-weight:800;cursor:pointer;line-height:1}
.tv{flex:1;display:grid;gap:0;min-width:0}
.tv input{width:100%;accent-color:var(--accent);margin:0}
.tv span{font-size:12px;color:var(--muted);font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.tv b{color:var(--ink);font-size:15px}
.tgls{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.tg{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted)}
.tg svg{width:16px;height:16px}
.tg[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pl.compact .tgls .tg[data-k="countIn"]{display:none}
.tap{display:grid;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.tap-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.tap-guide{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer}
.tap-guide input{width:18px;height:18px;accent-color:var(--accent)}
.tap-res{border-radius:14px;background:var(--surface-2);padding:12px 14px;display:grid;gap:4px}
.tap-res .tr-top{display:flex;align-items:center;gap:10px}
.tap-res .tr-top b{font-family:var(--f-display);font-size:26px}
.tap-res .tr-d{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tr-stars{display:flex;gap:2px}
.tr-stars svg{width:22px;height:22px}
.tap-fb{height:22px;text-align:center;font-weight:800;font-size:15px;letter-spacing:.02em}
.tap-fb.p,.tap-fb.b{color:var(--good)} .tap-fb.q{color:var(--warn)} .tap-fb.x{color:var(--bad)}
.pads{display:grid;gap:8px}
.pad-row{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px}
.pad{position:relative;min-height:84px;border-radius:16px;border:0;cursor:pointer;background:color-mix(in oklab,var(--pc) 16%,var(--surface));box-shadow:inset 0 0 0 2px color-mix(in oklab,var(--pc) 45%,transparent),0 4px 0 color-mix(in oklab,var(--pc) 40%,var(--line));display:grid;place-content:center;gap:2px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pad b{font-size:14px;font-weight:800;color:var(--ink)}
.pad small{font-size:11px;color:var(--muted);font-weight:700}
.pad.down{transform:translateY(3px);background:color-mix(in oklab,var(--pc) 42%,var(--surface));box-shadow:inset 0 0 0 2px var(--pc),0 1px 0 color-mix(in oklab,var(--pc) 40%,var(--line))}
@media (hover:none){.pad small{display:none}}

/* ---------- sheets (lesson, player) */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet[hidden]{display:none}
.sh-in{width:100%;max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ls-top{flex:none;padding-block:12px}
.ls-top .sh-in{display:flex;align-items:center;gap:10px}
.ls-bar{flex:1;height:14px;border-radius:10px;background:var(--line);overflow:hidden}
.ls-bar i{display:block;height:100%;width:0;background:var(--good);border-radius:10px;transition:width .35s ease;box-shadow:inset 0 3px 0 rgba(255,255,255,.28)}
.ls-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-block:6px 20px}
.ls-foot{flex:none;border-top:1px solid var(--line);background:var(--surface);padding-block:14px;transition:background .15s}
.ls-foot .sh-in{display:grid;gap:10px}
.ls-foot.ok{background:var(--good-soft);border-color:transparent}
.ls-foot.bad{background:var(--bad-soft);border-color:transparent}
.ls-fb{font-size:14.5px;line-height:1.4}
.ls-fb:empty{display:none}
.ls-fb b{display:block;font-family:var(--f-display);font-size:19px;margin-bottom:2px}
.ls-foot.ok .ls-fb b{color:var(--good)} .ls-foot.bad .ls-fb b{color:var(--bad)}
.card-step{display:grid;gap:12px}
.st-h{font-size:24px;font-weight:800}
.st-p{font-size:16px;color:var(--ink);max-width:60ch}
.st-p em{font-style:normal;font-weight:700;color:var(--accent)}
.st-fig{display:grid;gap:12px}
.st-fig .paper{padding:8px}
.snd{justify-self:start}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.opt .opt-n{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.opt.sel .opt-n{border-color:var(--accent);color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft);box-shadow:0 3px 0 var(--good)}
.opt.right .opt-n{border-color:var(--good);color:var(--good)}
.opt.wrong .opt-n{border-color:var(--bad);color:var(--bad)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)}
.opt:disabled{cursor:default}
.opt-score{flex-direction:column;align-items:stretch;padding:8px}
.opt-score .opt-n{position:absolute;left:8px;top:8px;z-index:1;background:var(--surface)}
.opt-sc{width:100%;background:var(--paper);border-radius:10px}
.opt-score{position:relative}
.big-snd{width:110px;height:110px;border-radius:50%;justify-self:center;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 0 var(--accent-deep)}
.big-snd svg{width:48px;height:48px}
.big-snd:active{transform:translateY(4px);box-shadow:0 2px 0 var(--accent-deep)}
.done{display:grid;justify-items:center;text-align:center;gap:14px;padding-top:24px}
.done-stars{display:flex;gap:8px}
.done-stars svg{width:58px;height:58px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.done-stars svg:nth-child(2){animation-delay:.12s} .done-stars svg:nth-child(3){animation-delay:.24s}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.done h2{font-size:30px}
.done-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:360px}
.done-box{border:2px solid var(--line);border-radius:16px;padding:10px;display:grid;gap:2px;background:var(--surface)}
.done-box b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.done-box span{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.done-box.xp b{color:var(--c-C)} .done-box.fire b{color:var(--c-K)}
.confirm{position:absolute;inset:0;z-index:5;background:color-mix(in oklab,var(--bg) 70%,transparent);display:grid;place-items:end center;padding:16px}
.confirm[hidden]{display:none}
.confirm-card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.confirm-card h3{font-size:20px}
.confirm-card p{color:var(--muted)}
.confirm-card .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pv-top{flex:none;padding-block:10px;border-bottom:1px solid var(--line);background:var(--surface)}
.pv-top .sh-in{display:flex;align-items:center;gap:8px}
.pv-top h2{font-size:19px;font-weight:800}
.pv-top .eyebrow{font-size:10.5px}
.pv-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-block:14px 24px}
.pv-body .sh-in{display:grid;gap:12px}
.pv-desc{color:var(--muted);font-size:14.5px}
.pv-tapbtn{justify-self:start}

/* ---------- kit */
.kit{width:100%;height:auto;max-width:520px;margin:0 auto}
.kit .stands path{fill:none;stroke:var(--stand);stroke-width:2.6;stroke-linecap:round}
.kit .kp{cursor:pointer;transition:opacity .2s}
.kit .kp.dim{opacity:.22}
.kit .shell{fill:var(--pc);stroke:color-mix(in oklab,var(--pc),black 30%);stroke-width:1}
.kit .head{fill:var(--head);stroke:var(--hoop);stroke-width:2.2}
.kit .cy{fill:url(#brz);stroke:var(--brz-line);stroke-width:1}
.kit .cy-l{fill:none;stroke:color-mix(in oklab,var(--brz-line) 45%,transparent);stroke-width:.8}
.kit .bell{fill:var(--brz-2);stroke:var(--brz-line);stroke-width:.8}
.kit .ring{fill:none;stroke:var(--pc);stroke-width:2.5}
.kit .rim{fill:none;stroke:var(--pc);stroke-width:4.5;pointer-events:stroke}
.kit .pedal{fill:var(--pc);stroke:color-mix(in oklab,var(--pc),black 30%)}
.kit .kl{font:800 10.5px var(--f-body);fill:var(--ink);text-anchor:middle;pointer-events:none}
.kit .kl.in{fill:var(--on-uc);font-size:10px}
.kit .kl.kh{fill:var(--head-ink);font-size:13px}
.kit .kl.sm{font-size:9.5px;fill:var(--muted)}
.kit .kp.sel .shell,.kit .kp.sel .cy,.kit .kp.sel .pedal{stroke:var(--accent);stroke-width:3}
.kit .kp.sel .rim{stroke:var(--accent)}
.kit .kp.sel .head{stroke:var(--accent);stroke-width:3}
.kit .kp.hit{animation:kphit .22s ease-out;transform-box:fill-box;transform-origin:center}
@keyframes kphit{40%{transform:scale(1.06)}}
.kit .i-K{--pc:var(--c-K)} .kit .i-S{--pc:var(--c-S)} .kit .i-H{--pc:var(--c-H)} .kit .i-P{--pc:var(--c-P)} .kit .i-R{--pc:var(--c-R)} .kit .i-C{--pc:var(--c-C)} .kit .i-Z{--pc:var(--c-Z)} .kit .i-T{--pc:var(--c-T)} .kit .i-M{--pc:var(--c-M)} .kit .i-F{--pc:var(--c-F)} .kit .i-A{--pc:var(--c-A)}
.kit-card{padding:10px 8px 4px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.kit-mini{padding:6px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 9px;font-size:13px;font-weight:700;cursor:pointer}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--pc)}
.chip[aria-pressed="true"]{border-color:var(--pc);background:color-mix(in oklab,var(--pc) 14%,var(--surface))}
.ki{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px}
.ki-head{display:flex;align-items:center;gap:12px}
.ki-dot{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:0 0 0 5px color-mix(in oklab,var(--pc) 22%,transparent);background:var(--pc)}
.ki-head h3{font-size:24px;font-weight:800}
.ki-en{font-size:13px;color:var(--muted);font-weight:600}
.ki p{max-width:62ch}
.ki-dl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
.ki-dl div{background:var(--surface-2);border-radius:12px;padding:9px 11px}
.ki-dl dt{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ki-dl dd{margin:2px 0 0;font-weight:600;font-size:14px}
.ki-staff{padding:6px}
.ki-btns{display:flex;flex-wrap:wrap;gap:10px}
.sec-h{display:grid;gap:4px;margin:30px 0 12px}
.sec-h h2{font-size:22px;font-weight:800}
.sec-h p{color:var(--muted);font-size:14px}
.key-list{display:grid;gap:8px}
.key-row{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 12px 6px 6px;cursor:pointer;text-align:left}
.key-row .ks{background:var(--paper);border-radius:10px}
.key-row b{display:block;font-size:15px}
.key-row span{font-size:13px;color:var(--muted)}
.fig-list{display:grid;gap:12px}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:8px}
.fig-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.fig-h b{font-family:var(--f-display);font-size:18px}
.fig-h span{font-size:12px;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px}
.fig p{font-size:14px;color:var(--muted)}

/* ---------- library & songs */
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .sec-b{font-size:13.5px}
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.item:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.item-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in oklab,var(--pc) 16%,var(--surface));color:var(--pc)}
.item-ic svg{width:22px;height:22px}
.item b{display:block;font-size:15.5px}
.item small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.item .meta{font-size:12px;font-weight:800;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lvl{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);margin-top:4px}
.lab{background:var(--surface);border:1.5px solid var(--accent);border-radius:20px;padding:16px;display:grid;gap:12px;margin-bottom:22px}
.lab h2{font-size:20px;font-weight:800}
.lab p{color:var(--muted);font-size:14px}
.lab-sel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lab-sel label{display:grid;gap:4px;font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);min-width:0}
.lab-sel select{font:600 14px var(--f-body);color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:9px 8px;width:100%;min-width:0}
.song{display:grid;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;cursor:pointer;box-shadow:0 4px 0 var(--line)}
.song:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.song-top{display:flex;align-items:flex-start;gap:12px}
.song-top .item-ic{width:48px;height:48px}
.song h3{font-size:19px;font-weight:800}
.song-meta{font-size:12.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.song p{font-size:14px;color:var(--muted)}
.song-parts{display:flex;flex-wrap:wrap;gap:4px}
.song-parts span{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row b{display:block;font-size:15px}
.set-row small{color:var(--muted);font-size:13px}
.switch{width:50px;height:30px;flex:none;border-radius:999px;border:0;background:var(--locked);position:relative;cursor:pointer}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.set-lat{display:grid;gap:6px;width:100%}
.set-lat input{width:100%;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;padding:10px 16px;border-radius:12px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.vis{opacity:1}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (min-width:560px){.st-h{font-size:28px}}
</style>

</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="16" cy="20" rx="12" ry="5" fill="var(--c-S)"/><rect x="4" y="13" width="24" height="7" fill="var(--c-S)"/><ellipse cx="16" cy="13" rx="12" ry="5" fill="var(--head)" stroke="var(--hoop)" stroke-width="1.5"/><path d="M7 3l9 10M25 3l-9 10" stroke="var(--c-C)" stroke-width="2.6" stroke-linecap="round"/></svg>Baqueta</div>
    <div class="stat fire" title="Dias seguidos praticando"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5c1 3.6 5.5 5.8 5.5 10.8a5.5 5.5 0 0 1-11 0c0-2.5 1.3-4 2.6-5.1.2 1.8 1.1 2.9 2.3 3.2-.6-3.4 0-6.2.6-8.9z"/></svg><span id="st-fire">0</span><span class="vh"> dias seguidos</span></div>
    <div class="stat xp" title="Pontos de experiência"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 2 4.5 13.5h6L9.5 22l9-11.5h-6z"/></svg><span id="st-xp">0</span><span class="vh"> XP</span></div>
    <button class="icon-btn" id="btn-set" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg></button>
  </div>
</header>

<main>
  <section class="view" id="view-trilha" aria-label="Trilha"></section>
  <section class="view" id="view-bateria" aria-label="Bateria" hidden></section>
  <section class="view" id="view-biblioteca" aria-label="Biblioteca" hidden></section>
  <section class="view" id="view-musicas" aria-label="Músicas" hidden></section>
</main>

<nav class="tabbar" aria-label="Seções">
  <div class="tabbar-in">
    <button class="tab" data-tab="trilha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M7 20c0-3.5 10-3 10-7.5S7 9 7 4.5"/><circle cx="7" cy="4" r="2.2" fill="currentColor"/><circle cx="17" cy="12.5" r="2.2" fill="currentColor"/><circle cx="7" cy="20" r="2.2" fill="currentColor"/></svg>Trilha</button>
    <button class="tab" data-tab="bateria"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="9" rx="8.5" ry="3.5"/><path d="M3.5 9v6.5c0 1.9 3.8 3.5 8.5 3.5s8.5-1.6 8.5-3.5V9"/><path d="M7.5 12.2v6M16.5 12.2v6" opacity=".55"/></svg>Bateria</button>
    <button class="tab" data-tab="biblioteca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4" width="4.5" height="16" rx="1.2"/><rect x="10" y="4" width="4.5" height="16" rx="1.2"/><path d="m16.6 5.3 3.4-.9 3 14.6-3.4.9z"/></svg>Biblioteca</button>
    <button class="tab" data-tab="musicas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5.5l11-2V16"/><circle cx="6.5" cy="18" r="2.6"/><circle cx="17.4" cy="16" r="2.6"/></svg>Músicas</button>
  </div>
</nav>

<div class="sheet" id="lesson" hidden role="dialog" aria-modal="true" aria-label="Lição">
  <div class="ls-top"><div class="sh-in"><button class="icon-btn" id="ls-x" aria-label="Fechar lição"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="ls-bar"><i id="ls-bar"></i></div></div></div>
  <div class="ls-body" id="ls-body-wrap"><div class="sh-in" id="ls-body"></div></div>
  <div class="ls-foot" id="ls-foot"><div class="sh-in"><div class="ls-fb" id="ls-fb" aria-live="polite"></div><button class="btn btn-primary btn-wide" id="ls-go">Continuar</button></div></div>
  <div class="confirm" id="ls-confirm" hidden><div class="confirm-card"><h3>Sair da lição?</h3><p>O que você fez nesta lição não será salvo.</p><div class="row"><button class="btn btn-ghost" id="ls-stay">Continuar</button><button class="btn btn-bad" id="ls-leave">Sair</button></div></div></div>
</div>

<div class="sheet" id="player" hidden role="dialog" aria-modal="true" aria-label="Player">
  <div class="pv-top"><div class="sh-in"><button class="icon-btn" id="pv-x" aria-label="Voltar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><div><div class="eyebrow" id="pv-k"></div><h2 id="pv-t"></h2></div></div></div>
  <div class="pv-body"><div class="sh-in" id="pv-body"></div></div>
</div>

<div class="sheet" id="settings" hidden role="dialog" aria-modal="true" aria-label="Ajustes">
  <div class="pv-top"><div class="sh-in"><button class="icon-btn" id="set-x" aria-label="Voltar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><div><div class="eyebrow">Baqueta</div><h2>Ajustes</h2></div></div></div>
  <div class="pv-body"><div class="sh-in" id="set-body"></div></div>
</div>

const barCache = new Map();
function parseBar(src) {
  const spec = BS[src] || src;
  if (barCache.has(spec)) return barCache.get(spec);
  const tracks = spec.trim().split(/\s+/).map(p => { const k = p.indexOf(':'); return [p.slice(0, k), p.slice(k + 1)]; });
  let steps = 1;
  for (const [, s] of tracks) steps = lcm(steps, s.length);
  if (steps % 4) steps = lcm(steps, 4);
  const hits = Array.from({ length: steps }, () => []);
  for (const [i, s] of tracks) {
    if (!INST[i]) throw new Error('Peça desconhecida: ' + i);
    const f = steps / s.length;
    for (let k = 0; k < s.length; k++) { const ch = s[k]; if (ch !== '.' && ch !== '-') hits[k * f].push({ i, m: ch }); }
  }
  const bar = { steps, hits, spec };
  barCache.set(spec, bar);
  return bar;
}
function mk(list, o = {}) { return { bars: list.map(parseBar), beats: 4, bpm: o.bpm || 80, title: o.title || '', sections: o.sections || null, song: !!o.song }; }
function usedInsts(pat) { const s = new Set(); for (const b of pat.bars) for (const hs of b.hits) for (const n of hs) s.add(n.i); return KIT_ORDER.filter(i => s.has(i)); }

  addPlayer(body.querySelector('.st-pl'), st.bars, { compact: true, bpm: st.bpm });
}
function stepSong(st, body) {

  const pl = mountPlayer(body.querySelector('.st-pl'), songPattern(s), { sections: true, bpm: s.bpm, countIn: true });

}
function stepTap(st, body, go) {
  body.innerHTML = `<div class="card-step"><div class="eyebrow">Toque junto</div><h2 class="st-h">${esc(st.h || 'Sua vez de tocar')}</h2><p class="st-p">${st.p || 'Aperte <em>Começar a tocar</em>. Depois de 4 cliques de contagem, toque os botões no tempo das notas. Cada nota fica verde quando você acerta.'}</p><div class="st-pl"></div></div>`;

    onTap: r => { const L = LS.cur; L.tapBest = Math.max(L.tapBest, r.stars); go.textContent = 'Continuar'; go.className = 'btn btn-primary btn-wide'; } });
}
function stepQuiz(st, body, go) {
  const L = LS.cur;
  let opts, correct, q, fig = '';
  if (st.kind === 'note') { q = 'Qual peça está escrita aqui?'; opts = shuffle(st.pool).map(i => ({ label: INST[i].name, val: i })); correct = st.inst; fig = `<div class="paper">${noteStaffSVG([st.inst], { ink: true, gap: 120, zoom: 1.6 })}</div>`; }
  else if (st.kind === 'sound') { q = 'Que peça você ouviu?'; opts = shuffle(st.pool).map(i => ({ label: INST[i].name, val: i })); correct = st.inst; fig = `<button class="big-snd" aria-label="Ouvir de novo">${ICON.speaker}</button>`; }
  else if (st.kind === 'text') { q = st.q; opts = st.opts.map((t, k) => ({ label: t, val: k })); correct = st.ok; if (st.bars) fig = '<div class="q-fig"></div>'; }
  else { q = st.q || 'Qual partitura corresponde ao que você ouve?'; opts = shuffle([st.ok, ...st.alts]).map(b => ({ bars: b, val: b === st.ok ? 1 : 0 })); correct = 1; fig = `<button class="btn btn-ghost snd q-play">${ICON.play}<span>Ouvir</span></button>`; }
  const letters = 'ABCD';
  body.innerHTML = `<div class="card-step"><div class="eyebrow">${st.retry ? 'Revisão' : 'Exercício'}</div><h2 class="st-h">${esc(q)}</h2><div class="st-fig">${fig}</div><div class="opts" role="radiogroup" aria-label="Opções">${opts.map((o, k) => o.bars
    ? `<button class="opt opt-score" role="radio" aria-checked="false" data-k="${k}"><span class="opt-n">${letters[k]}</span><div class="opt-sc"></div></button>`
    : `<button class="opt" role="radio" aria-checked="false" data-k="${k}"><span class="opt-n">${k + 1}</span><span>${esc(o.label)}</span></button>`).join('')}</div></div>`;
  if (st.kind === 'sound') { const play = () => AU.hit(st.inst, AU.ensure().currentTime + 0.02); body.querySelector('.big-snd').onclick = play; setTimeout(play, 350); }
  if (st.kind === 'text' && st.bars) addPlayer(body.querySelector('.q-fig'), st.bars, { mini: true, bpm: 76 });
  if (st.kind === 'pattern') {
    const p = mk(st.ok, { bpm: st.bpm || 80 });
    const b = body.querySelector('.q-play');
    let playing = false;
    const setB = on => { playing = on; b.innerHTML = `${on ? ICON.stop : ICON.play}<span>${on ? 'Parar' : 'Ouvir'}</span>`; };
    const playIt = () => { if (playing) { TR.stop(); return; } setB(true); TR.start(p, { bpm: st.bpm || 80, passes: 2, metro: true, onStop: () => setB(false) }); };
    b.onclick = playIt;
    setTimeout(() => { if (LS.cur === L && L.steps[L.i] === st && !playing) playIt(); }, 400);
    $$('.opt-sc', body).forEach((h, k) => {
      const pat = mk(opts[k].bars);
      let lw = 0;
      const ro = new ResizeObserver(() => { const w = h.clientWidth; if (!w || Math.abs(w - lw) < 4) return; lw = w; renderScore(h, pat, { width: w, counts: false, ink: true, repeat: true }); });
      ro.observe(h); L.cleanup.push(() => ro.disconnect());
    });
  }
  let sel = null;
  const btns = $$('.opt', body);
  btns.forEach(b => b.addEventListener('click', () => { sel = +b.dataset.k; btns.forEach(x => { const on = x === b; x.classList.toggle('sel', on); x.setAttribute('aria-checked', on); }); go.disabled = false; }));
  go.textContent = 'Verificar'; go.disabled = true;
  go.onclick = () => {
    if (sel == null) return;
    TR.stop();
    const ok = opts[sel].val === correct, ci = opts.findIndex(o => o.val === correct);
    btns.forEach((b, k) => { b.disabled = true; if (k === ci) b.classList.add('right'); else if (k === sel) b.classList.add('wrong'); });
    const foot = $('#ls-foot'); foot.classList.add(ok ? 'ok' : 'bad');
    const right = opts[ci].bars ? `opção ${letters[ci]}` : opts[ci].label;
    $('#ls-fb').innerHTML = ok ? `<b>Isso aí!</b>${st.why ? esc(st.why) : ''}` : `<b>Resposta certa: ${esc(right)}</b>${st.why ? esc(st.why) : 'Essa volta no fim da lição.'}`;
    if (ok) AU.hit('Z', AU.ensure().currentTime + 0.01, 0.55); else AU.hit('F', AU.ensure().currentTime + 0.01, 0.7);
    if (!ok) { L.mistakes++; L.steps.push({ ...st, retry: true }); }
    go.textContent = 'Continuar'; go.className = 'btn btn-wide ' + (ok ? 'btn-good' : 'btn-bad'); go.onclick = nextStep;
  };
}
function finishLesson() {
  const L = LS.cur; cleanupStep(); L.done = true;
  const stars = L.hasTap ? Math.max(1, L.tapBest) : 3 - Math.min(2, L.mistakes);
  const prev = PR.done[L.node.id];
  const xp = prev ? 5 : 10 + stars * 5;
  PR.done[L.node.id] = { s: Math.max(stars, prev?.s || 0), d: today() };
  PR.xp += xp; bumpStreak(); save();
  $('#ls-bar').style.width = '100%';
  const nextNode = NODES[firstOpen()];
  lsBody().innerHTML = `<div class="done"><div class="done-stars" aria-label="${stars} de 3 estrelas">${starsHTML(stars)}</div><h2>Lição concluída!</h2><p class="st-p">${esc(L.node.title)}${L.hasTap ? '' : L.mistakes ? ` · ${L.mistakes} ${L.mistakes > 1 ? 'erros revisados' : 'erro revisado'}` : ' · sem erros'}</p><div class="done-grid"><div class="done-box xp"><span>XP ganho</span><b>+${xp}</b></div><div class="done-box fire"><span>Sequência</span><b>${streakNow()} ${streakNow() === 1 ? 'dia' : 'dias'}</b></div></div>${nextNode ? `<p class="pv-desc">Próxima: ${esc(nextNode.title)}</p>` : '<p class="pv-desc">Você concluiu a trilha inteira!</p>'}</div>`;
  AU.sting(true);
  const go = $('#ls-go'); go.textContent = 'Continuar'; go.className = 'btn btn-primary btn-wide'; go.disabled = false; go.onclick = closeLesson;
  renderTop();
}
function closeLesson() {
  cleanupStep(); LS.cur = null;
  $('#lesson').hidden = true; document.body.classList.remove('locked');
  renderPath();
  requestAnimationFrame(() => { const c = $('.node.current'); if (c) c.scrollIntoView({ block: 'center', behavior: 'smooth' }); });
}
$('#ls-x').addEventListener('click', () => { if (!LS.cur || LS.cur.done) closeLesson(); else { TR.stop(); $('#ls-confirm').hidden = false; } });
$('#ls-stay').addEventListener('click', () => { $('#ls-confirm').hidden = true; });
$('#ls-leave').addEventListener('click', () => { $('#ls-confirm').hidden = true; closeLesson(); });
